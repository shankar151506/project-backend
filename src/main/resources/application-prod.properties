# ========== Production Profile ==========

# Database – values MUST be provided via environment variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_companion_db?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate – validate only; never auto-modify the production schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.root=WARN
logging.level.com.travelcompanion=INFO
logging.level.org.springframework.security=WARN
