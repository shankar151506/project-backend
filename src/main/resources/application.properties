spring.datasource.url=${DB_URL:jdbc:h2:file:./data/traveldb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://frontend-peach-eight-99.vercel.app}

spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Actuator – expose health endpoint only
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
